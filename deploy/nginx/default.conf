server {
  listen 80;
  server_name _;
  client_max_body_size 128k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /backend/ws/ { proxy_pass http://backend:8000/ws/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /backend/ { proxy_pass http://backend:8000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
